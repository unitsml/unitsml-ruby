name: parg-parser

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run the full suite with the PARG parser as default
        run: UNITSML_PARSER=parg bundle exec rspec
