name: rake

on:
  push:
    branches: [ master, main ]
    tags: [ v* ]
  pull_request:

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main
    with:
      before-setup-ruby: |
        mkdir -p .bundle
        touch .bundle/config
        cat .bundle/config
        git clone --depth 1 https://github.com/unitsml/unitsml-testsuite.git unitsml-testsuite
        echo "CORPUS_DIR=$PWD/unitsml-testsuite/corpora/renders" >> "$GITHUB_ENV"
        echo "---" >> .bundle/config
        echo 'BUNDLE_BUILD__RUBY___LL: "--with-cflags=-std=gnu17"' >> .bundle/config
        cat .bundle/config
    secrets:
      pat_token: ${{ secrets.UNITSML_CI_PAT_TOKEN }}
